services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: snowimpact
      POSTGRES_USER: snowimpact
      POSTGRES_PASSWORD: snowimpact-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowimpact"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build: .
    environment:
      SNOWIMPACT_ENV: development
      SNOWIMPACT_DATABASE_URL: postgresql+psycopg://snowimpact:snowimpact-local@postgres:5432/snowimpact
      SNOWIMPACT_REDIS_URL: redis://redis:6379/0
      SNOWIMPACT_DEMO_MODE: "true"
      SNOWIMPACT_API_KEY: local-development-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
    environment:
      SNOWIMPACT_API: http://api:8080
      SNOWIMPACT_API_KEY: local-development-key
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
