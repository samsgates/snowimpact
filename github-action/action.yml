name: SnowImpact Analysis
description: Analyze Snowflake SQL changes for blast radius, security, governance and FinOps risk.
inputs:
  path:
    description: SQL migration file to analyze
    required: true
  fail-closed:
    description: Block when metadata coverage is insufficient
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install SnowImpact
      shell: bash
      run: python -m pip install "$GITHUB_WORKSPACE"
    - name: Analyze Snowflake change
      shell: bash
      env:
        SNOWIMPACT_FAIL_CLOSED: ${{ inputs.fail-closed }}
      run: |
        args=(impact "${{ inputs.path }}" --format sarif)
        if [[ "$SNOWIMPACT_FAIL_CLOSED" == "true" ]]; then args+=(--fail-closed); fi
        snowimpact "${args[@]}" > snowimpact.sarif
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snowimpact.sarif
